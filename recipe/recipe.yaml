context:
  name: pixi-inject
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/pavelzw/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 90aa1ef8fd40b3261c3cc0668dcc960b42c2313cc9a4a180bbc51665fbd5f830

build:
  number: 0
  script:
    env:
      # Use cmake to build aws-lc-sys, because conda's CFLAGS inject -O2 which
      # overrides the -O0 required by jitterentropy-base.c, causing a build failure.
      AWS_LC_SYS_CMAKE_BUILDER: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - export OPENSSL_DIR="$PREFIX"
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - pkg-config
    - cmake
    - make
  host:
    - if: unix
      then: openssl

tests:
  - script:
      - pixi-inject --help
  - package_contents:
      bin:
        - pixi-inject
      strict: true

about:
  homepage: https://github.com/pavelzw/pixi-inject
  summary: Inject conda packages into an already existing conda prefix
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/pavelzw/pixi-inject

extra:
  recipe-maintainers:
    - pavelzw
